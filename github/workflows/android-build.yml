名称：构建Android安装包

在……之上：
workflow_dispatch：#手动触发，方便测试
推：
标签：
-'v*'#推送v1.0.0这类tag时自动构建

权限：
内容：write#如果后续要自动创建释放，需要这个权限

作业：
建立：
run-on:ubuntu-latest

步骤：
-名称：结帐
用途：操作/签出@v4

-名称：设置节点.js
用途：操作/setup-node@v4
和……一起：
节点版本：'22'
快取：'npm'

-名称：安装Java
用法：操作/setup-java@v5
和……一起：
分布：'铁木林
java版本："21"

-名称：安装Android SDK
用途：android-actions/setup-android@v3

-名称：安装依赖项
运行：npm ci

-名称：生成Web资产
运行：npm运行生成

-名称：同步电容器
运行：npx cap sync android

-名称：解码密钥库
运行：|
echo“${{机密".Android_KEYSTORE_BASE64}}"|base64--解码>/tmp/发布。密钥库

-名称：构建签名发布安装包
工作目录：./安卓
env：
keystore_PATH:/tmp/release.keystore
keystore_PASSWORD：${{secrets.Android_KEYSTORE_PASSWORD}}
key_ALIAS：${{secrets.android_KEY_ALIAS}}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
运行：|
./gradlew assemblyRelease\
-手安卓注射了。签署。商店。file=$KEYSTORE_PATH\
-手安卓注射了。签署。商店。password=$KEYSTORE_PASSWORD\
-手安卓注射了。签署。钥匙。alias=$KEY_ALIAS\
-手安卓注射了。签署。钥匙。password=$KEY_PASSWORD

-名称：清理密钥库
if:always()
运行：rm-f/tmp/release.keystore

-名称：上传APK工件
用法：操作/上载工件@v4
和……一起：
名称：应用程序版本-${{github.ref_name}}
路径：Android/app/build/outputs/apk/release/*.apk
保留天数：7
